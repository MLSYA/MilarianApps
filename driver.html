<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bagikan Lokasi Driver</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: auto; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; font-size: 16px; }
    button { background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:disabled { background-color: #ccc; }
    .status { margin-top: 15px; font-weight: bold; text-align: center; color: #007bff; }
  </style>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <h2>GPS Tracking Driver</h2>
  <label>Nama Driver</label>
  <input type="text" id="driverName" placeholder="Contoh: Budi">

  <label>Nomor Polisi (Nopol)</label>
  <input type="text" id="driverNopol" placeholder="Contoh: B 1234 XYZ">

  <button id="btnShare" onclick="toggleTracking()">Bagikan Lokasi Live</button>

  <div class="status" id="statusText">Status: Tidak Aktif</div>

  <script>
    // Konfigurasi Firebase Anda
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyA3Ctgfp-1D5HhJbTToljYUmJ62jCmutWg",
  authDomain: "milarianapps.firebaseapp.com",
  databaseURL: "https://milarianapps-default-rtdb.firebaseio.com",
  projectId: "milarianapps",
  storageBucket: "milarianapps.firebasestorage.app",
  messagingSenderId: "335524059263",
  appId: "1:335524059263:web:fc3848ac597f873867074a",
  measurementId: "G-WBPR6JQVJQ"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let watchId = null;
    let isTracking = false;

   function toggleTracking() {
  const name = document.getElementById('driverName').value.trim();
  let rawNopol = document.getElementById('driverNopol').value.trim().toUpperCase();
  
  if (!name || !rawNopol) {
    alert('Mohon isi Nama dan Nopol terlebih dahulu!');
    return;
  }

  // Sanitize Nopol agar aman digunakan sebagai Key Firebase (hapus spasi dan simbol)
  const safeNopol = rawNopol.replace(/[^A-Z0-9]/g, '');

  const btn = document.getElementById('btnShare');
  const status = document.getElementById('statusText');

  if (!isTracking) {
    if ("geolocation" in navigator) {
      // Di dalam driver.html pada fungsi watchPosition:
watchId = navigator.geolocation.watchPosition(
  (position) => {
    const lat = position.coords.latitude;
    const lng = position.coords.longitude;
    const heading = position.coords.heading || 0; // Arah derajat (0 - 360)
    const speed = position.coords.speed ? Math.round(position.coords.speed * 3.6) : 0; // km/jam
    const timestamp = new Date().toLocaleTimeString();

    // Kirim data ke Firebase
    database.ref('drivers/' + safeNopol).set({
      nama: name,
      nopol: rawNopol,
      lat: Number(lat),
      lng: Number(lng),
      heading: Number(heading), // Simpan arah pergerakan
      speed: Number(speed),     // Simpan kecepatan
      lastUpdate: timestamp,
      updatedAt: firebase.database.ServerValue.TIMESTAMP
    });

    status.innerText = `Lokasi Terkirim! (${timestamp}) | Kecepatan: ${speed} km/j`;
  },
  (error) => {
    alert("Gagal mengambil lokasi GPS: " + error.message);
  },
  { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
);
      isTracking = true;
      btn.innerText = "Hentikan Membagikan Lokasi";
      btn.style.backgroundColor = "#dc3545";
      document.getElementById('driverName').disabled = true;
      document.getElementById('driverNopol').disabled = true;
    } else {
      alert("GPS tidak didukung oleh browser ini.");
    }
  } else {
    navigator.geolocation.clearWatch(watchId);
    isTracking = false;
    btn.innerText = "Bagikan Lokasi Live";
    btn.style.backgroundColor = "#28a745";
    status.innerText = "Status: Berhenti Membagikan";
    document.getElementById('driverName').disabled = false;
    document.getElementById('driverNopol').disabled = false;
      }
    }
  </script>
</body>
</html>
