<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Induk - Live Tracking</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 100vh; width: 100%; }
    body { margin: 0; padding: 0; }
  </style>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <div id="map"></div>

  <script>
    // Konfigurasi Firebase (Harus sama dengan driver.html)
   // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyA3Ctgfp-1D5HhJbTToljYUmJ62jCmutWg",
  authDomain: "milarianapps.firebaseapp.com",
  databaseURL: "https://milarianapps-default-rtdb.firebaseio.com",
  projectId: "milarianapps",
  storageBucket: "milarianapps.firebasestorage.app",
  messagingSenderId: "335524059263",
  appId: "1:335524059263:web:fc3848ac597f873867074a",
  measurementId: "G-WBPR6JQVJQ"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Inisialisasi Peta (Default pusat di Jakarta)
    const map = L.map('map').setView([-6.200000, 106.816666], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const markers = {};

// Dengarkan perubahan data driver secara Realtime
database.ref('drivers').on('value', (snapshot) => {
  const data = snapshot.val();
  if (!data) return;

  for (let key in data) {
    const driver = data[key];

    // Konversi paksa ke Number
    const lat = Number(driver.lat);
    const lng = Number(driver.lng);

    // Cek apakah angka valid (bukan NaN)
    if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
      if (markers[key]) {
        markers[key].setLatLng([lat, lng]);
      } else {
        const marker = L.marker([lat, lng]).addTo(map);
        marker.bindPopup(`<b>${driver.nama}</b><br>${driver.nopol}`);
        markers[key] = marker;
      }
    }
  }

  // Otomatis sesuaikan tampilan peta agar semua driver terlihat
  if (bounds.length > 0) {
    map.fitBounds(bounds, { maxZoom: 15, padding: [50, 50] });
  }
}, (error) => {
  console.error("Gagal mengambil data Firebase:", error);
  alert("Gagal membaca database: " + error.message);
});
  </script>
</body>
</html>
