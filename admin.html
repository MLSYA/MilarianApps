<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Induk - Live Tracking</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 100vh; width: 100%; }
    body { margin: 0; padding: 0; }
  </style>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <div id="map"></div>

  <script>
    // Konfigurasi Firebase (Harus sama dengan driver.html)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Inisialisasi Peta (Default pusat di Jakarta)
    const map = L.map('map').setView([-6.200000, 106.816666], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const markers = {};

    // Mendengarkan perubahan data secara Realtime dari Firebase
    database.ref('drivers').on('value', (snapshot) => {
      const data = snapshot.val();
      
      for (let nopol in data) {
        const driver = data[nopol];
        const lat = driver.lat;
        const lng = driver.lng;

        // Jika marker sudah ada, perbarui posisinya
        if (markers[nopol]) {
          markers[nopol].setLatLng([lat, lng]);
          markers[nopol].getPopup().setContent(
            `<b>Driver:</b> ${driver.nama}<br><b>Nopol:</b> ${driver.nopol}<br><b>Update:</b> ${driver.lastUpdate}`
          );
        } else {
          // Buat marker baru jika driver belum terdaftar di peta
          const marker = L.marker([lat, lng]).addTo(map);
          marker.bindPopup(
            `<b>Driver:</b> ${driver.nama}<br><b>Nopol:</b> ${driver.nopol}<br><b>Update:</b> ${driver.lastUpdate}`
          );
          markers[nopol] = marker;
        }
      }
    });
  </script>
</body>
</html>
